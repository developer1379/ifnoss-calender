<div class="min-h-screen bg-transparent flex flex-col">
  <!-- Top Viewport Accent Line -->
  <div class="h-[3px] w-full bg-gradient-to-r from-blue-500 via-sky-500 to-cyan-500 z-50"></div>

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-200/40 bg-white/75 backdrop-blur-md px-8 py-3 flex items-center justify-between sticky top-0 z-50 shadow-[0_2px_15px_-4px_rgba(15,23,42,0.04)]">
    <div class="flex items-center gap-3">
      <div class="w-9.5 h-9.5 rounded-xl bg-gradient-to-tr from-blue-600 via-blue-500 to-indigo-500 flex items-center justify-center shadow-[0_3px_10px_rgba(37,99,235,0.2)] border border-blue-400/10 flex-shrink-0">
        <mat-icon class="text-white text-base" style="color: white !important;">auto_awesome</mat-icon>
      </div>
      <div class="flex flex-col sm:flex-row sm:items-center gap-1.5 sm:gap-2.5">
        <span class="text-sm font-black text-slate-800 tracking-tight leading-none">EduSchedule</span>
        <span class="text-[8px] font-black text-blue-600 bg-blue-50 border border-blue-100/60 px-2 py-0.5 rounded-full uppercase tracking-widest leading-none self-start sm:self-auto">Conflict Detection Portal</span>
      </div>
    </div>

    <!-- Live Status Badge -->
    <div class="hidden sm:flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-full text-[9px] font-extrabold text-emerald-700 uppercase tracking-wider">
      <span class="relative flex h-1.5 w-1.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
      </span>
      <span>Active Sync</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow w-full px-4 sm:px-6 py-6">
    <mat-tab-group dynamicHeight animationDuration="200ms" class="theme-light-tabs bg-white/70 border border-white/60 backdrop-blur-xl rounded-2xl p-2 md:p-4 min-h-[600px] shadow-lg">
      
      <!-- Tab 1: Calendar Scheduler -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-2 py-2">
            <mat-icon class="text-blue-600 text-lg">grid_on</mat-icon>
            <span class="font-bold text-xs uppercase tracking-wider">Scheduler Grid</span>
          </div>
        </ng-template>
        <div class="pt-4 h-full">
          <app-calendar></app-calendar>
        </div>
      </mat-tab>

      <!-- Tab 2: Teachers -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-2 py-2">
            <mat-icon class="text-blue-600 text-lg">people</mat-icon>
            <span class="font-bold text-xs uppercase tracking-wider">Teachers</span>
          </div>
        </ng-template>
        <div class="pt-4 h-full">
          <app-teachers></app-teachers>
        </div>
      </mat-tab>

      <!-- Tab 3: Courses -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-2 py-2">
            <mat-icon class="text-blue-600 text-lg">school</mat-icon>
            <span class="font-bold text-xs uppercase tracking-wider">Courses</span>
          </div>
        </ng-template>
        <div class="pt-4 h-full">
          <app-courses></app-courses>
        </div>
      </mat-tab>

      <!-- Tab 4: Rooms -->
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="flex items-center gap-2 py-2">
            <mat-icon class="text-blue-600 text-lg">meeting_room</mat-icon>
            <span class="font-bold text-xs uppercase tracking-wider">Classrooms</span>
          </div>
        </ng-template>
        <div class="pt-4 h-full">
          <app-rooms></app-rooms>
        </div>
      </mat-tab>

    </mat-tab-group>
  </main>

  <!-- Footer -->
  <footer class="py-6 text-center mt-8 opacity-60">
    <p class="text-[9px] text-slate-450 font-bold tracking-wider uppercase">© 2026 EduSchedule • Dynamic Conflict Management Portal</p>
  </footer>
</div>
